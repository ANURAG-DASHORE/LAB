<title>Lab - Anurag Dashore</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: #f8f9fa;
    font-family: Arial, "Google Sans", "Helvetica Neue", sans-serif;
    color: #202124;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  main {
    flex: 1;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 72px 24px 60px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 8px;
  }

  p.lede {
    color: #5f6368;
    font-size: 15px;
    margin: 0 0 44px;
  }

  ul.projects {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  ul.projects li {
    border-top: 1px solid #dadce0;
  }

  ul.projects li:last-child {
    border-bottom: 1px solid #dadce0;
  }

  ul.projects a {
    display: block;
    padding: 22px 4px;
    text-decoration: none;
    color: inherit;
  }

  ul.projects a:hover .title {
    color: #1a73e8;
  }

  .title {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .desc {
    font-size: 14px;
    color: #5f6368;
    margin: 0;
  }

  footer {
    border-top: 1px solid #dadce0;
    background: #ffffff;
  }

  .footer-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .footer-links {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .footer-links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    color: #5f6368;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .footer-links a:hover {
    background: #f1f3f4;
    color: #1a73e8;
  }

  .footer-links svg {
    width: 18px;
    height: 18px;
  }

  .footer-name {
    font-size: 13.5px;
    color: #5f6368;
  }

  @media (max-width: 480px) {
    .footer-inner {
      justify-content: center;
      text-align: center;
    }
  }
</style>
</head>
